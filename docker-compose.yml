# Full local stack. Project name defaults to the directory name, so no
# per-project edits are needed here.
services:
  db:
    image: postgres:18-alpine
    restart: always
    expose:
      - 5432
    ports:
      # Bound to loopback: reachable from the host for local dev tooling, but
      # never exposed on the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER:-postgres} -d ${POSTGRES__DB:-app}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      - POSTGRES_PASSWORD=${POSTGRES__PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES__USER:-postgres}
      - POSTGRES_DB=${POSTGRES__DB:-app}
    volumes:
      # Postgres 18 moved the image's VOLUME up one level (PGDATA is now the
      # version-specific /var/lib/postgresql/18/docker) so that pg_upgrade
      # --link works across major versions. Mounting the old .../data path
      # would leave the database outside the volume.
      - postgres-data:/var/lib/postgresql

  # Bind-mounted host directories are created root-owned by the Docker daemon,
  # so hand ./data to the api image's non-root user (uid 1001, see
  # backend/Dockerfile) once before the api boots. The api creates the
  # subdirectories itself on startup.
  data-init:
    image: alpine:3
    command: sh -c "chown 1001:1001 /data"
    volumes:
      - ./data:/data

  api:
    restart: unless-stopped
    command: bash -c "alembic upgrade head && fastapi run app/main.py"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
        restart: true
      data-init:
        condition: service_completed_successfully
    volumes:
      # Runtime data tree (inbox/, originals/, streams/, quarantine/). The
      # container WORKDIR is /app, so the DATA__ROOT default of `data`
      # resolves here.
      - ./data:/app/data
    build:
      context: ./backend
      dockerfile: Dockerfile

  # MCP server — same image as the api, different entrypoint. Requires
  # MCP__API_KEYS in .env (see .env.example): with no keys it logs an error and
  # exits 1 rather than serving an unauthenticated tool surface.
  mcp:
    restart: unless-stopped
    command: python -m app.mcp.main
    ports:
      # Loopback only: the public path is Caddy's /mcp* route.
      - "127.0.0.1:8001:8001"
    healthcheck:
      # /health is the one route served without a bearer token.
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
        restart: true
    build:
      context: ./backend
      dockerfile: Dockerfile

  frontend:
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
        restart: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same origin: the browser calls /api/... on whatever host
        # served the page and Caddy proxies it to the API.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_API_PATH: ${NEXT_PUBLIC_API_PATH:-/api/v1}

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # `:80` = plain HTTP, no automatic TLS. Set CADDY_SITE_ADDRESS to a
      # hostname and Caddy provisions certificates and serves HTTPS.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      # `mcp` is deliberately absent: Caddy resolves upstreams per request, so
      # the /mcp* route works as soon as the MCP server is up. Waiting on it
      # would take the whole site down whenever MCP__API_KEYS is missing —
      # /mcp returns 502 in the meantime, everything else keeps serving.
      api:
        condition: service_healthy
        restart: true
      frontend:
        condition: service_healthy
        restart: true
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
