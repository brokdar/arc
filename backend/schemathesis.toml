# Increment 1 adds four wellness operations whose rules a JSON schema cannot
# express, each pinned by a unit test (test_wellness_api, test_wellness_backfill):
#
#   * a day is dated by the morning it describes, so any past date is legal and
#     a **future** one is refused — a reading for tomorrow is a typo, not a
#     late entry, and a schema has no way to say "not after today";
#   * a write must set something: a body with every field omitted, or one that
#     clears the last value on a day that does not exist, records nothing;
#   * an HRV reading must state its statistic and its measurement context —
#     three columns that are legal individually and only mean anything
#     together;
#   * a range is half-open and must be non-empty, and a backfill is refused
#     whole when any one of its days breaks a rule, with the date named.
#
# `GET /wellness/days/{local_date}` and `GET /wellness/weight` need no entry:
# they refuse only with 404, which the default already admits.

[[operations]]
include-name = "PATCH /api/v1/wellness/days/{local_date}"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "POST /api/v1/wellness/backfill"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "GET /api/v1/wellness/days"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

# `GET /wellness/trend` refuses the same two range rules `GET /wellness/days`
# does — a range must not be inverted and must not exceed 371 days — and a
# schema cannot express either. Both are pinned in `test_wellness_api.py`.
# The metric parameter needs no narrowing: it is a closed enum in the contract,
# so a schema-valid request cannot name a metric that does not exist.

[[operations]]
include-name = "GET /api/v1/wellness/trend"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

# `POST /agent-notes/{note_id}/dispute` takes one field, `rating`, and
# `DisputeRating` deliberately has two members — so the operation has four
# distinct schema-valid bodies in total: either rating, an explicit null, or the
# field omitted. Asking for 100 examples of a four-value space makes hypothesis
# filter almost everything it generates, and it raises `filter_too_much` on the
# seeds where that ratio happens to look pathological. The failure is real but it
# is about the request for 100 examples, not about the API: the run that tripped
# it still generated and passed 15478 cases.
#
# So the operation is sized to its own input space rather than the health check
# being suppressed globally — a suppressed `filter_too_much` would also hide the
# next genuinely over-constrained schema someone adds.

[[operations]]
include-name = "POST /api/v1/agent-notes/{note_id}/dispute"
generation.max-examples = 5

# `POST /wellness/prompt` answers the day's standing question, so it carries
# every refusal the dated PATCH does — a future date is impossible here, but an
# HRV reading without its statistic and context, and a body that sets nothing,
# are both 422s a JSON schema cannot express. Pinned in `test_wellness_api.py`
# (`test_a_write_that_fails_validation_leaves_the_prompt_pending`). The 404 and
# 409 the operation also returns — no prompt standing, and a prompt that
# already expired — are in the default list and need no entry.

[[operations]]
include-name = "POST /api/v1/wellness/prompt"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

# The Dropbox connect surface refuses four things a JSON schema cannot state,
# each pinned by a unit test (`test_connections_api.py`):
#
#   * starting a connection needs an app key, in the panel or in
#     `DROPBOX__APP_KEY`, and without one the answer carries the registration
#     steps rather than handing back a link with a blank `client_id` that fails
#     on Dropbox's own error page minutes later;
#   * an app key that is nothing but whitespace passes `min_length` and is
#     still not a key, so it is refused by the service as a sentence;
#   * a pasted code is only redeemable against the PKCE flow it was minted for,
#     within fifteen minutes, and only if Dropbox granted offline access — none
#     of which is a property of the request body;
#   * browsing folders on a connection whose stored credential will not decrypt
#     is refused naming `SECRETS__ENCRYPTION_KEY`.
#
# One outbound request became reachable when the app key moved into the
# database: a fuzz run can PUT a key, start a flow and then offer `complete` a
# code, which is a token exchange against api.dropboxapi.com with a code
# Dropbox has never issued. Both answers — Dropbox refusing the code, and the
# host being unreachable from CI — are the 422 this operation already
# documents, so the run is unaffected either way. `folders` still reaches
# nothing: with no connection row it is a 404 before any client is built.

[[operations]]
include-name = "PUT /api/v1/connections/dropbox/app"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "POST /api/v1/connections/dropbox/authorize"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "POST /api/v1/connections/dropbox/complete"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "GET /api/v1/connections/{connection_id}/folders"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]
