# Schemathesis configuration for the API fuzz job (.github/workflows/api-fuzz.yml).
#
# Auto-discovered: the job runs with working-directory `backend`, and the CLI
# reads `schemathesis.toml` from the current directory.
#
# What is configured here is one check, `positive_data_acceptance`, and only
# for the operations where a schema-compliant request is *rightly* refused.
# Its default expectation — a valid-looking request gets 2xx/401/403/404/409 —
# cannot hold for an API with rules a JSON schema cannot express:
#
#   * the append-only anchor refusals answer 405 by design; a fuzzer
#     reading the schema has no way to know PUT is documented in order to be
#     refused,
#   * anchor and profile writes are validated against domain rules — per-type
#     plausibility bounds, `tested` provenance requiring a protocol, the
#     confidence interval bracketing the value — which reach the client
#     as 422s the schema does not describe,
#   * zones exist only for anchor types a zone model derives from, so
#     `?anchor_type=max_hr` is schema-valid and semantically empty.
#
# Every one of those refusals is pinned by a unit test, which is the condition
# for narrowing a check at all. The check stays fully armed everywhere
# else, and `expected-statuses` here *replaces* the default list, so each entry
# repeats the statuses the operation can legitimately return.

[[operations]]
include-name = "PUT /api/v1/anchors/{anchor_version_id}"
[operations.checks.positive_data_acceptance]
expected-statuses = [405]

[[operations]]
include-name = "PATCH /api/v1/anchors/{anchor_version_id}"
[operations.checks.positive_data_acceptance]
expected-statuses = [405]

[[operations]]
include-name = "DELETE /api/v1/anchors/{anchor_version_id}"
[operations.checks.positive_data_acceptance]
expected-statuses = [405]

[[operations]]
include-name = "POST /api/v1/anchors"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "PATCH /api/v1/athlete"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "GET /api/v1/zones"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "GET /api/v1/anchors/{anchor_version_id}/zones"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

# WP-2 adds four more write operations whose grammar a JSON schema cannot
# express, all pinned by unit tests (test_workouts_api, test_planned_sessions_api):
#
#   * a step states exactly one of duration_s and distance_m, repeat blocks
#     nest at most four deep, a percentage target names an anchor its channel
#     derives from, an absolute one uses that channel's unit (app.domain.workout),
#   * a strength prescription references the bundled exercise catalogue,
#   * a planned session takes exactly one of workout_id and structure, its
#     purpose and workout agree on a discipline, and every anchor it refers to
#     has a version in force (build-plan invariant 4).

[[operations]]
include-name = "POST /api/v1/workouts"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "PATCH /api/v1/workouts/{workout_id}"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "POST /api/v1/planned-sessions"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "PATCH /api/v1/planned-sessions/{planned_session_id}"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

# WP-4 adds three write operations whose rules a JSON schema cannot express,
# each pinned by a unit test (test_ingest_api, test_sessions_api):
#
#   * an upload must not be empty and must be under 100 MB — a schema can
#     describe "a file part", not "a file with bytes in it". (A file whose
#     *contents* are unusable is not a refusal: it answers 200 with a
#     `quarantined` outcome, which is a result and not an error.)
#   * a session's timezone override must resolve to a real zone: an IANA name,
#     a UTC±HH:MM offset, or UTC. A stored timezone that cannot be resolved
#     makes the session's date unrecoverable, so it is refused where it
#     is written, and a patch that supplies no field at all is refused too.
#   * a manually entered session's sets name exactly one of exercise_id and
#     exercise_name, and its duration, RPE, reps, load and RIR carry bounds
#     that are domain rules rather than schema ones.

[[operations]]
include-name = "POST /api/v1/ingest/upload"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "PATCH /api/v1/sessions/{session_id}"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "POST /api/v1/manual-sessions"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

# WP-6 adds three write operations whose rules a JSON schema cannot express,
# each pinned by a unit test (test_matching_api):
#
#   * a link joins a recording to a planned session of a discipline it could
#     correspond to — a swim is not a strength session under any reading, and
#     a recording classified `other` is not planned in any discipline at all;
#   * a retarget must name a *different* planned session from the one the link
#     already points at;
#   * a merge joins two device recordings of one ride: not a session with
#     itself, not one typed in by hand, and not two rides further apart than
#     `MAX_MERGE_GAP_S`.
#
# The rest of the matching surface — confirm, reject, unlink, re-match, mark
# unplanned — refuses only with 404 and 409 and needs no entry.

[[operations]]
include-name = "POST /api/v1/matches"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "PATCH /api/v1/matches/{match_id}"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

[[operations]]
include-name = "POST /api/v1/sessions/{session_id}/merge"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]

# WP-8 adds one read whose rule a JSON schema cannot express, pinned by a unit
# test (test_agent_notes_api::test_a_read_of_a_week_that_is_not_a_monday_is_refused):
#
#   * agent notes about a plan week are keyed by the Monday the week starts on;
#     any other date is refused rather than snapped, because snapping
#     would file two notes about one week under two keys.

[[operations]]
include-name = "GET /api/v1/agent-notes"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422]
