[project]
name = "backend"
description = "arc API service"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]
# Deliberately absent: the Anthropic SDK. This backend is the coaching agent's
# *tool surface*, not a model client — the agent connects from outside over
# MCP, and nothing here calls a model. An unused dependency would also have to
# be classified by the domain-purity contract below and its completeness test,
# so it would be permanent noise in two places.
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "apscheduler>=3.11,<4",
    "fastmcp>=3.4,<4",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "structlog>=25.5.0",
    "bcrypt>=5",
    "itsdangerous>=2.2",
    "garmin-fit-sdk>=21.212.0",
    "fitdecode>=0.11.0",
    "gpxpy>=1.6.2",
    "tcxreader>=0.4.11",
    "pyarrow>=25.0.0",
    # The outbound half of the Dropbox connector. Already present transitively
    # (fastapi[standard] ships it, and the test client is built on it), named
    # here because `app.connectors` imports it directly: a transitive
    # dependency is one `uv lock` away from not being there.
    "httpx>=0.28.1",
    # Fernet, for the OAuth credentials at rest (`app/persistence/connections.py`).
    "cryptography>=45",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",
    "pytest-xdist>=3.8.0",
    "asgi-lifespan>=2.1.0",
    "aiosqlite>=0.21.0",
    "ruff>=0.15.0",
    "pyrefly>=1.1.0",
    "import-linter>=2.3",
    "hypothesis>=6.165.1",
    "fit-tool>=0.9.16",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version", root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 88
target-version = "py314"
fix = true
extend-exclude = ["app/persistence/alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "Q",      # flake8-quotes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "S",      # flake8-bandit
    "PTH",    # flake8-use-pathlib
    "ISC",    # implicit string concatenation
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "ASYNC",  # flake8-async
    "PERF",   # perflint
]
ignore = [
    "E501",  # line length handled by the formatter
    "W505",
    "D100",  # module docstrings not required
    "D104",  # package docstrings not required
    "D107",  # __init__ docstrings not required
    "D401",
    "B008",  # FastAPI Depends() in argument defaults
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the point of tests
    "S105",  # hardcoded test credentials
    "S106",
    "D",     # docstrings optional in tests
    # Blocking filesystem calls in an async test are the point: WP-4's ingest
    # writes real files, and asserting one exists is not event-loop work worth
    # an async filesystem layer. The rule still applies to `app/`.
    "ASYNC240",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/persistence/alembic/*"]
# SQLAlchemy's asyncio layer switches greenlets; without this, code awaited
# across the sync/async bridge is reported as uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# --- Architecture boundaries (import-linter) ---------------------------------
# `uv run lint-imports` — enforced in CI, the `just lint` recipe and pre-push.
# `app.core` is deliberately absent from the layer stack: it is cross-cutting
# (config, logging, exceptions, scheduler) and every layer may use it.
[tool.importlinter]
root_package = "app"
# Needed so the forbidden contract below can name third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
# A deny-list only bites for what it names, so every runtime dependency has to
# appear here or on the explicit allowlist in
# tests/unit/test_domain_purity_contract.py, which fails when a new dependency
# is classified as neither.
name = "Domain is pure (no I/O, no frameworks, no outer layers)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "fastapi",
    "starlette",
    "httpx",
    "pydantic_settings",
    "apscheduler",
    "structlog",
    "fastmcp",
    "bcrypt",
    "itsdangerous",
    # WP-4's file readers and the parquet writer. All five are I/O: they open
    # files. The domain never sees a FIT record or an arrow table — it sees
    # `RawSample` and plain sequences — so `app.ingest` is the only layer that
    # may import them (work order §1).
    "garmin_fit_sdk",
    # `garmin-fit-sdk`'s wheel also installs top-level `dist` and `tests`
    # packages — a packaging defect in that distribution, not a decision of
    # ours. They are named here because the self-maintaining guard in
    # tests/unit/test_domain_purity_contract.py checks every import name a
    # dependency provides, and forbidding them is true anyway: nothing in
    # `app.domain` has business importing a package called `tests`.
    "dist",
    "tests",
    "fitdecode",
    "gpxpy",
    "tcxreader",
    "pyarrow",
    # The connector's two: `httpx` was already forbidden here (the domain has
    # no business making a request), and `cryptography` joins it — a layer that
    # computes training rules over plain values never encrypts anything.
    "cryptography",
    "app.connectors",
    "app.persistence",
    "app.services",
    "app.api",
    "app.mcp",
    "app.ingest",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "API and MCP adapters are independent"
type = "independence"
modules = ["app.api", "app.mcp"]

[[tool.importlinter.contracts]]
# Increment 1's D6: arc stores readings, computes descriptive statistics and
# states maturity. It emits no readiness verdict and gates no session on one —
# thresholds are athlete-specific and rolling, and encoding them before the
# baselines mature is confabulation with extra steps. Deterministic gating
# belongs to the constraint engine of a later increment.
#
# The first draft of the plan proposed "a test asserting the constraint surface
# is unchanged", which is not a test anyone can write. This is: the moment
# somebody wires a wellness reading into the proposal rules or the guardrails,
# the build fails, by the same mechanism that already enforces domain purity.
# The red flag stays the only deterministic gate on the agent surface.
name = "Wellness does not gate training (Increment 1, D6)"
type = "forbidden"
source_modules = [
    "app.services.proposals",
    "app.services.guardrails",
    "app.domain.proposals",
]
# Both wellness modules: the baseline half is the one that would be tempting,
# because it is where "this marker is 2 SD below normal" finally becomes a
# number a rule could compare against. It is still not a verdict, and wiring it
# into the constraint surface before the baselines have matured is exactly the
# confabulation D6 refuses.
forbidden_modules = ["app.domain.wellness", "app.domain.wellness_baseline"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
# `app.connectors` sits between services and persistence: a connector may read
# and re-seal the connection row whose credential it refreshes, and may never
# reach up into a service. Left unlayered, an outbound client importing
# `app.services.connections` would be a circular design import-linter could not
# see — and it is exactly the import somebody adds when a connector needs "just
# one" use-case.
layers = [
    "app.api | app.mcp",
    "app.ingest",
    "app.services",
    "app.connectors",
    "app.persistence",
    "app.domain",
]
