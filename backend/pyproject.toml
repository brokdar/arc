[project]
name = "backend"
description = "arc API service"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "apscheduler>=3.11,<4",
    "fastmcp>=3.4,<4",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",
    "pytest-xdist>=3.8.0",
    "asgi-lifespan>=2.1.0",
    "aiosqlite>=0.21.0",
    "ruff>=0.15.0",
    "pyrefly>=1.1.0",
    "import-linter>=2.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version", root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 88
target-version = "py314"
fix = true
extend-exclude = ["app/persistence/alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "Q",      # flake8-quotes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "S",      # flake8-bandit
    "PTH",    # flake8-use-pathlib
    "ISC",    # implicit string concatenation
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "ASYNC",  # flake8-async
    "PERF",   # perflint
]
ignore = [
    "E501",  # line length handled by the formatter
    "W505",
    "D100",  # module docstrings not required
    "D104",  # package docstrings not required
    "D107",  # __init__ docstrings not required
    "D401",
    "B008",  # FastAPI Depends() in argument defaults
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the point of tests
    "S105",  # hardcoded test credentials
    "S106",
    "D",     # docstrings optional in tests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/persistence/alembic/*"]
# SQLAlchemy's asyncio layer switches greenlets; without this, code awaited
# across the sync/async bridge is reported as uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# --- Architecture boundaries (import-linter) ---------------------------------
# `uv run lint-imports` — enforced in CI, the `just lint` recipe and pre-push.
# `app.core` is deliberately absent from the layer stack: it is cross-cutting
# (config, logging, exceptions, scheduler) and every layer may use it.
[tool.importlinter]
root_package = "app"
# Needed so the forbidden contract below can name third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure (no I/O, no frameworks, no outer layers)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "fastapi",
    "starlette",
    "httpx",
    "pydantic_settings",
    "apscheduler",
    "structlog",
    "app.persistence",
    "app.services",
    "app.api",
    "app.mcp",
    "app.ingest",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "API and MCP adapters are independent"
type = "independence"
modules = ["app.api", "app.mcp"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.api : app.mcp",
    "app.ingest",
    "app.services",
    "app.persistence",
    "app.domain",
]
