# Throwaway Postgres for integration tests. Started/stopped by
# scripts/run-integration-tests.sh; uses port 5433 to avoid clashing with a
# running dev database.
services:
  db-test:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 2s
      retries: 15
      timeout: 5s
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=postgres
      - POSTGRES_DB=app_test
    tmpfs:
      - /var/lib/postgresql/data
