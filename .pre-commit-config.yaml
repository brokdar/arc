# Hooks are managed by prek (https://prek.j178.dev), a drop-in pre-commit
# replacement. Install shims once:
#   prek install -t pre-commit -t pre-push -t commit-msg
#
# Cheap checks run on commit; heavy checks (types, tests) run on push.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
# Pin hooks that don't declare their own `stages` to pre-commit only —
# otherwise they'd run at BOTH commit and push once the pre-push shim exists.
default_stages: [pre-commit]

repos:
  # ============================================================================
  # Commit messages
  # ============================================================================
  # Conventional commits are the input `just changelog` parses (cliff.toml), and
  # `filter_unconventional` drops anything it cannot parse — a malformed subject
  # would vanish from the draft silently. The format is enforced, not documented.
  # The type list mirrors cliff.toml's commit_parsers exactly.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, revert, docs, chore, build, ci, test, style]

  # ============================================================================
  # General checks
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These declare `stages: [pre-commit, pre-push, manual]` upstream; pin
      # to pre-commit so the fixers never mutate files mid-push.
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^(\.vscode|\.devcontainer)/
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]

  # ============================================================================
  # Backend (Python)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        name: backend-ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: backend-ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: backend-pyrefly
        name: backend-pyrefly
        entry: bash -c 'cd backend && uv run pyrefly check app tests'
        types: [python]
        pass_filenames: false
        language: system
        files: ^backend/
        stages: [pre-push]
      - id: backend-import-linter
        name: backend-import-linter
        entry: bash -c 'cd backend && uv run lint-imports'
        types: [python]
        pass_filenames: false
        language: system
        files: ^backend/
        stages: [pre-push]
      - id: backend-unit-tests
        name: backend-unit-tests
        entry: bash -c 'cd backend && uv run pytest tests/unit -n auto'
        types: [python]
        pass_filenames: false
        language: system
        files: ^backend/
        stages: [pre-push]
      # `alembic check` runs in exactly one place — the Postgres integration
      # suite — so model/migration drift is discovered in the most expensive
      # tier there is, and the fix costs a second run of it. This needs no
      # database: it refuses a push whose diff moves DDL without shipping a
      # revision. Heuristic by design; `alembic check` is still the authority.
      - id: migration-required
        name: migration-required
        entry: ./scripts/check-migration-required.sh
        language: script
        pass_filenames: false
        files: ^backend/app/persistence/.*\.py$
        stages: [pre-push]
      # The check above is a heuristic over diff text, so it rots silently when
      # the model idiom shifts. Its cases run whenever it or its helpers change.
      - id: migration-required-test
        name: migration-required-test
        entry: ./scripts/check-migration-required.test.sh
        language: script
        pass_filenames: false
        files: ^scripts/(check-migration-required(\.test)?|git-push-range)\.sh$

  # ============================================================================
  # API contract synchronization
  # ============================================================================
  - repo: local
    hooks:
      - id: api-schema-sync-check
        name: api-schema-sync-check
        entry: ./scripts/check-api-schema-sync.sh
        language: script
        pass_filenames: false
        always_run: true

  # ============================================================================
  # Frontend (TypeScript/React)
  # ============================================================================
  - repo: local
    hooks:
      - id: frontend-check
        name: frontend-check (biome)
        entry: bash -c 'cd frontend && bun run lint'
        pass_filenames: false
        language: system
        files: ^frontend/.*\.(tsx?|jsx?|mjs|json|css)$
      - id: frontend-type-check
        name: frontend-type-check
        entry: bash -c 'cd frontend && bun run type-check'
        pass_filenames: false
        language: system
        files: ^frontend/.*\.(tsx?)$
        stages: [pre-push]
      - id: frontend-unit-tests
        name: frontend-unit-tests
        entry: bash -c 'cd frontend && bun run test'
        pass_filenames: false
        language: system
        files: ^frontend/(app|components|lib|tests)/.*\.(tsx?|jsx?)$
        stages: [pre-push]
      # The production build was the one `just check` gate no hook ran, so a
      # build-only failure — the class `tsgo --noEmit` cannot see — was first
      # discovered in `frontend-checks.yml`, and the fix cost a second run of
      # it. Same trigger as that workflow's `paths:` filter, so green here and
      # green there are the same statement.
      # The path gate is `run-if-changed`, not `files:` — prek widens its own
      # file set to the whole tree whenever the branch has no remote counterpart
      # (its first push, and every retry after a failed one), which would make
      # every new branch pay a production build it did not earn.
      - id: frontend-build
        name: frontend-build
        entry: ./scripts/run-if-changed.sh ^frontend/ -- bash -c 'cd frontend && bun run build'
        pass_filenames: false
        language: script
        always_run: true
        stages: [pre-push]

  # ============================================================================
  # Workflow security
  # ============================================================================
  # Mirrors zizmor.yml. Workflow files change rarely, so this almost never runs
  # — but when it does, a lint discovered in CI costs a whole run to learn
  # something `uvx` answers in seconds. Needs network for the first `uvx` fetch;
  # if you are offline, SKIP=zizmor and let CI have it.
  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: ./scripts/run-if-changed.sh '^\.github/workflows/.*\.ya?ml$' -- uvx zizmor .github/workflows/
        pass_filenames: false
        language: script
        always_run: true
        stages: [pre-push]
