version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      devcontainers:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-deps:
        patterns: ["*"]
    ignore:
      # Majors are handled manually (security majors still alert)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
