name: Full-Stack Smoke

# Boots the real compose stack (Postgres, API + migrations, frontend, Caddy)
# and runs the tiny @fullstack Playwright suite against it — through the proxy
# on :80. This is the top of the test pyramid — it verifies wiring, not logic.
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "caddy/Caddyfile"
      - ".env.example"
      - ".github/workflows/docker-compose-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create .env from example
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES__PASSWORD=.*/POSTGRES__PASSWORD=ci-test/' .env
          sed -i 's/^AUTH__JWT__SECRET_KEY=.*/AUTH__JWT__SECRET_KEY=ci-test-secret-key-32-characters!/' .env
          sed -i "s|^MCP__API_KEYS=.*|MCP__API_KEYS='ci:read:ci-test-mcp-key'|" .env

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build and start the full stack
        run: docker compose up --build --wait db api mcp frontend caddy

      - name: Check API health (direct)
        run: curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health

      - name: Check API health through the Caddy proxy
        run: curl --fail --retry 5 --retry-delay 3 http://localhost/health

      - name: Check the frontend through the Caddy proxy
        run: curl --fail --retry 5 --retry-delay 3 http://localhost/

      - name: Check the MCP server rejects unauthenticated calls through Caddy
        # 401 proves the whole path is wired: Caddy -> mcp -> bearer auth.
        # A 502 would mean the proxy route or the container is broken.
        run: |
          status=$(curl -sf --retry 5 --retry-delay 3 http://localhost/mcp \
            -H 'Accept: application/json, text/event-stream' \
            -o /dev/null -w '%{http_code}' || true)
          echo "GET /mcp -> $status"
          test "$status" = "401"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run full-stack smoke tests
        run: bunx playwright test
        working-directory: frontend
        env:
          E2E_FULLSTACK: "1"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
