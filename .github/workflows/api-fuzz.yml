name: API Fuzz (Schemathesis)

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-fuzz.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Backstop: without this a hung fuzz step would spin for the 6h default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      POSTGRES__HOST: localhost
      POSTGRES__PORT: "5433"
      POSTGRES__USER: postgres
      POSTGRES__PASSWORD: test
      POSTGRES__DB: app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait db-test

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Start API
        run: |
          uv run fastapi run app/main.py --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Fuzz the API from its OpenAPI schema
        # negative_data_rejection is excluded by design: FastAPI ignores
        # unknown query parameters, which that check treats as a failure.
        #
        # schemathesis runs unpinned via `uvx` (floats to the latest release),
        # and current versions intermittently hang on exit AFTER finishing
        # every check: the CLI prints its summary and writes the JUnit report,
        # but the process never returns. Bound it with `timeout`; if that
        # teardown hang trips the guard, trust the JUnit report (already on
        # disk) for the verdict instead of letting the job hang.
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 8m \
            uvx schemathesis run http://localhost:8000/openapi.json \
              --max-examples 100 \
              --exclude-checks negative_data_rejection \
              --report junit \
              --report-dir schemathesis-report
          st=$?
          set -e

          # A normal exit is authoritative: 0 = all checks passed, any other
          # value below the timeout codes = real findings. Use it directly.
          if [ "$st" -ne 124 ] && [ "$st" -ne 130 ] && [ "$st" -ne 137 ]; then
            exit "$st"
          fi

          # 124/130/137 = the timeout guard fired on the teardown hang. The run
          # itself completed, so fall back to the JUnit report for the verdict.
          echo "::warning::schemathesis did not exit within the time limit (status $st); consulting the JUnit report."
          if ! ls schemathesis-report/*.xml >/dev/null 2>&1; then
            echo "::error::schemathesis hung before writing its JUnit report"
            exit 1
          fi
          bad=$(grep -ohE '(failures|errors)="[0-9]+"' schemathesis-report/*.xml | grep -cvE '="0"' || true)
          if [ "${bad:-0}" -ne 0 ]; then
            echo "::error::schemathesis reported failures/errors"
            exit 1
          fi
          echo "schemathesis completed all checks cleanly but hung on exit; treating as pass."

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemathesis-report
          path: backend/schemathesis-report
          retention-days: 7
