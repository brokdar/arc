name: API Fuzz (Schemathesis)

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-fuzz.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Backstop: without this a hung fuzz step would spin for the 6h default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      POSTGRES__HOST: localhost
      POSTGRES__PORT: "5433"
      POSTGRES__USER: postgres
      POSTGRES__PASSWORD: test
      POSTGRES__DB: app_test
      # Fixed bcrypt hash of "ci-test-password". No escaping needed: YAML
      # scalars are literal, so the `$`s survive as-is.
      AUTH__PASSWORD_HASH: "$2b$12$zKJ/WPCZxSLDiNcagKB4NuxBO3.OqDch0OfYVoTkNfFBvjnvREdVm"
      AUTH__SESSION__SECRET_KEY: ci-fuzz-session-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait db-test

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Start API
        run: |
          uv run fastapi run app/main.py --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Log in and capture the session cookie
        # Every endpoint except /health and /api/v1/auth/* is behind the
        # session guard, so without this the fuzzer would only ever see 401s.
        run: |
          curl -sf -c cookies.txt -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci-test-password"}'
          value=$(awk '$6 == "arc_session" { print $7 }' cookies.txt)
          test -n "$value"
          echo "SESSION_COOKIE=arc_session=$value" >> "$GITHUB_ENV"

      - name: Fuzz the API from its OpenAPI schema
        # negative_data_rejection is excluded by design: FastAPI ignores
        # unknown query parameters, which that check treats as a failure.
        #
        # ignored_auth is excluded because the session cookie is supplied as a
        # raw --header (schemathesis has no CLI flag for an apiKey scheme), so
        # the check cannot strip it before probing and every protected
        # operation looks unauthenticated-but-accepted. The property it tests
        # is covered directly by tests/unit/test_auth.py.
        #
        # positive_data_acceptance is NOT excluded, but narrowed per operation
        # in backend/schemathesis.toml (auto-discovered from this job's
        # working directory) for the handful that refuse schema-valid input on
        # purpose — the append-only 405s and the domain-rule 422s. That file
        # states which, and why.
        #
        # Expect standing "schema validation mismatch" warnings: for
        # POST /api/v1/auth/login (a login endpoint rejects essentially every
        # generated password, which the heuristic reads as over-strict
        # validation), and for the operations whose domain rules the schema
        # cannot express. Warnings, not failures.
        #
        # This step used to look hung and was not. It runs four phases over
        # every operation in the schema — examples, coverage, fuzzing,
        # stateful — and **prints nothing between them**, because there is no
        # TTY in CI and the live progress bar is suppressed. The fuzzing phase
        # alone was 278 s of silence after "Coverage ✅", which reads exactly
        # like a hung process and is really ~15 000 HTTP requests.
        #
        # The comment that used to live here diagnosed that silence as
        # schemathesis "intermittently hanging on exit" and built a fallback
        # that treated a killed run as a pass if the JUnit report looked clean.
        # It was wrong twice over: no run in this repo's history has ever hit
        # the guard (they land at 280-420 s against an 8 m limit, and the CLI
        # prints its summary and exits 0), and the fallback meant a genuine
        # timeout — the one thing the guard exists to catch — would have been
        # reported as success off a partial report.
        #
        # So: the timeout stays as a real backstop and now **fails** when it
        # fires, and the run is parallel so the silence is roughly halved.
        #
        # `--workers auto` is one worker per vCPU, and roughly halves the wall
        # clock (278 s -> 184 s measured on a full run at four workers).
        #
        # `auto` rather than a literal, because the literal is a fact about the
        # runner that this file has no business asserting: a standard
        # `ubuntu-latest` is 4 vCPU while this repo is **public** and 2 vCPU if
        # it ever goes private, and a hardcoded 4 would quietly over-subscribe
        # the day that changed. The step prints `nproc` so the log says what it
        # actually chose rather than leaving the next reader to assume.
        #
        # Concurrency here is load, not just speed: the same run at 28 workers
        # on a developer machine produced failures that four never sees. If
        # this job starts flaking, check the worker count in the log before
        # anything else.
        #
        # Parallelism is also why `POST /auth/logout` is excluded. It calls
        # `session.clear()`, so fuzzing it destroys the one credential every
        # other operation depends on — serially that is survivable, in parallel
        # it 401s whatever else is in flight. It is covered directly by
        # tests/unit/test_auth.py, which is the same trade the `ignored_auth`
        # exclusion above already makes.
        #
        # Worth keeping: the concurrency is a test in its own right. Turning it
        # on immediately found two read-then-insert races in the wellness
        # upsert that a serial run could never reach, so a flake here is a bug
        # worth chasing rather than noise worth retrying.
        #
        # The version is pinned. `uvx schemathesis` floats to the latest
        # release, so CI behaviour could change with no commit — every action
        # above is pinned to a SHA for exactly that reason, and the fuzzer
        # deserves the same. Bump it deliberately.
        #
        # `jsonschema-rs` is pinned for the same reason, one level down, and
        # the pin above did not reach it: schemathesis 4.24.3 requires
        # `jsonschema-rs>=0.49.0` with no upper bound, so `uvx` resolves it
        # fresh on every run. 0.50.0 dropped `CanonicalSchema.is_satisfiable`,
        # which 4.24.3 calls, and the job went from green to 98 of 99
        # operations erroring — on no commit at all, sixteen minutes after
        # that release. Lift this the day schemathesis ships a version that
        # supports 0.50; it is a bound on somebody else's break, not on ours.
        run: |
          # `|| st=$?` rather than a bare call: Actions runs this with
          # `bash -e`, so a non-zero exit would abort the script before the
          # annotation below could explain it.
          echo "runner has $(nproc) vCPU; --workers auto takes one each"
          st=0
          timeout --signal=INT --kill-after=30s 8m \
            uvx --with 'jsonschema-rs<0.50' \
            schemathesis==4.24.3 run http://localhost:8000/openapi.json \
              --max-examples 100 \
              --workers auto \
              --exclude-path /api/v1/auth/logout \
              --header "Cookie: $SESSION_COOKIE" \
              --exclude-checks negative_data_rejection,ignored_auth \
              --report junit \
              --report-dir schemathesis-report || st=$?

          # 124/130/137 mean the guard fired. That is a real failure — either
          # the API stopped answering or the suite has outgrown the limit — and
          # the honest response is to say so, not to go looking for a report
          # that describes an incomplete run.
          if [ "$st" -eq 124 ] || [ "$st" -eq 130 ] || [ "$st" -eq 137 ]; then
            echo "::error::schemathesis did not finish within 8 minutes (status $st). If the run is simply growing, raise the limit here deliberately; if it stopped making progress, that is the bug."
          fi
          exit "$st"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemathesis-report
          path: backend/schemathesis-report
          retention-days: 7
