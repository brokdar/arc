name: API Schema Sync

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/generated/**"
      # generate-api-types.sh shells out to openapi-typescript and biome via
      # `bunx`, so their versions come from the frontend manifest and lockfile:
      # bumping either can change the generated output, and without these paths
      # a Dependabot bump lands that drift on main unchecked.
      - "frontend/package.json"
      - "frontend/bun.lock"
      - "scripts/generate-api-types.sh"
      - "scripts/check-api-schema-sync.sh"
      - ".github/workflows/api-schema-sync.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Check generated API types are in sync
        run: bash scripts/check-api-schema-sync.sh
