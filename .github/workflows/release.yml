name: Release

# Tag a release (e.g. `git tag v1.2.0 && git push --tags`) to build and
# publish the images to GHCR as:
#   ghcr.io/<owner>/<repo>/api:<version>       + :latest
#   ghcr.io/<owner>/<repo>/mcp:<version>       + :latest
#   ghcr.io/<owner>/<repo>/frontend:<version>  + :latest
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
          # Same Dockerfile and context as the api — published separately so
          # deployments can pin and scale the MCP server on its own. The
          # compose `command` selects the entrypoint.
          - image: mcp
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # QEMU lets the amd64 runner cross-build the arm64 layers — the images
      # also run on ARM SBCs (e.g. an Odroid or Raspberry Pi home server),
      # which must pull, never build: a 4 GB SBC cannot build the frontend.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # For the frontend, NEXT_PUBLIC_* is baked at build time. Set it as
          # a repository *variable* (Settings → Secrets and variables →
          # Actions → Variables) to point releases at your real API.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
