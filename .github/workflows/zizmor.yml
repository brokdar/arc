name: Workflow Security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      # The pin this job runs from. Without it a Dependabot bump of zizmor
      # would land without ever running zizmor.
      - "tools/requirements.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Audit workflows with zizmor
        # The version is in tools/requirements.txt, not in this line: the
        # pre-push hook constrains against the same file, so a local pass and a
        # CI pass mean the same thing. Dependabot raises that pin, and this
        # workflow triggers on the file, so the bump audits the workflows with
        # the version it is proposing.
        run: uvx --constraints tools/requirements.txt zizmor .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
